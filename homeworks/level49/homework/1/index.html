<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
        }

        button {
            padding: 12px 8px;
            width: 150px;
            background-color: chartreuse;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 500ms linear 200ms;
        }

        button:hover {
            background: linear-gradient(to left, green, rgb(53, 92, 15));
            transform: scale(1.05) translateY(-5px);
            box-shadow: 1px 11px 70px 3px rgba(255, 255, 255, 0.42);
            -webkit-box-shadow: 1px 11px 70px 3px rgba(255, 255, 255, 0.42);
            -moz-box-shadow: 1px 11px 70px 3px rgba(255, 255, 255, 0.42);
        }
    </style>
</head>

<body>
    <button>Hover over me!</button>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            font-family: Arial, sans-serif;
        }

        .loader {
            width: 260px;
        }

        h1 {
            font-size: 35px;
            font-weight: 900;
            letter-spacing: -1.5px;
        }

        .yellow {
            color: #e8d45b;
        }

        .dark {
            color: #292929;
        }

        /* Animated dots */

        .dots span {
            display: inline-block;
            color: #a4a4a4;
            opacity: 0;
            animation: dots 1.5s infinite;
        }

        .dots span:nth-child(1) {
            animation-delay: 0s;
        }

        .dots span:nth-child(2) {
            animation-delay: 0.25s;
        }

        .dots span:nth-child(3) {
            animation-delay: 0.5s;
        }

        @keyframes dots {

            0%,
            20% {
                opacity: 0;
            }

            40%,
            100% {
                opacity: 1;
            }
        }

        /* Progress bar */

        .progress {
            width: 100%;
            height: 5px;
            background: #e8d45b;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            background: #83b83e;

            transform: scaleX(0);
            transform-origin: left;

            animation: loading 2s ease-in-out infinite;
        }

        @keyframes loading {
            0% {
                transform: scaleX(0);
            }

            70% {
                transform: scaleX(1);
            }

            100% {
                transform: scaleX(0);
            }
        }
    </style>
</head>

<body>
    <div class="loader">
        <h1>
            <span class="yellow">LOAD</span><span class="dark">ING</span><span class="dots">
                <span>.</span><span>.</span><span>.</span>
            </span>
        </h1>

        <div class="progress">
            <div class="progress-fill"></div>
        </div>
    </div>
</body>

</html>

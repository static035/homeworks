<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #4169df;
            width: 100%;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .scene {
            width: 500px;
            height: 500px;
            position: relative;
        }

        .path {
            width: 200px;
            height: 200px;

            border: 1px dashed #fff;
            border-radius: 50%;

            position: absolute;
            left: 150px;
            top: 150px;
        }

        .ball {
            width: 50px;
            height: 50px;
            background: burlywood;
            border-radius: 50%;

            position: absolute;
            left: 225px;
            top: 125px;

            animation: orbit 4s linear infinite;
        }

        @keyframes orbit {
            0% {
                transform: translate(0, 0);
            }

            12.5% {
                transform: translate(70px, 30px);
            }

            25% {
                transform: translate(100px, 100px);
            }

            37.5% {
                transform: translate(70px, 170px);
            }

            50% {
                transform: translate(0, 200px);
            }

            62.5% {
                transform: translate(-70px, 170px);
            }

            75% {
                transform: translate(-100px, 100px);
            }

            87.5% {
                transform: translate(-70px, 30px);
            }

            100% {
                transform: translate(0, 0);
            }
        }
    </style>
</head>

<body>
    <div class="scene">
        <div class="path"></div>
        <div class="ball"></div>
    </div>
</body>

</html>

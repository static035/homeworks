<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            gap: 25px;
        }
        .child {
            height: 10rem;
            padding: 25px;
            background-color: hotpink;
            border-radius: 10px;
            color: aliceblue;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="child">
            <h3>Lorem ipsum dolor sit amet.</h3>
        </div>
        <div class="child">
            <h3>The quick brown fox jumps over the lazy dog</h3>
        </div class="child">
        <div class="child">
            <h3>hi</h3>
        </div>
    </div>
</body>

</html>
